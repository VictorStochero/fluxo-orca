# Agentes do Orca (tela de agentes, Orca 1.4.241). Uma linha por agente: chave|id-orca|comando|argumentos|medidor|pre|fim|regras|skills|testado|nota
# chave: o nome usado em `agente=` no ~/.claude/agentes.conf.
# id-orca: para `worker-start --agent <id>`; vazio = só despacho por terminal (orca-libera.sh --cria --command), que vale para qualquer CLI.
# medidor: claude (/usage da conta, por CLAUDE_CONFIG_DIR) | orca:<fornecedor> (rateLimits do `orca account list --json`) | - (sem medição: só vagas).
# pre: hook antes de comando (trava de comando remoto, instala-agente.sh) sim|nao|- ; papel de trabalho (escritor, mecanico, revisor, verificador) só em agente com pre=sim E testado=data (isentos: claude, codex, antigravity).
# fim: hook de fim de turno (fim-worker.sh) sim|nao|- ; sem ele o coordenador cobra o worker_done (orca-espera.sh).
# regras: arquivo global de regras (recebe extras/AGENTS.global.md); skills: diretório de skills do agente; "-" = desconhecido ou inexistente. "~" é o HOME.
# testado: data (AAAA-MM-DD) da prova de despacho do GUIA (fase 4b) ou "-". Capacidades vêm das docs oficiais, não de execução:
#   gemini  https://geminicli.com/docs/hooks/reference/ (BeforeTool, AfterAgent) e https://geminicli.com/docs/cli/skills
#   kimi    https://moonshotai.github.io/kimi-cli/en/customization/hooks.md (PreToolUse, Stop) e https://www.kimi.com/code/docs/en/kimi-code-cli/customization/skills.html
#   zcode   https://github.com/zai-org/ZCode/tree/master/apps/zcode-cli/docs/usage (09-hooks, 11-memory, 08-skills)
#   opencode https://opencode.ai/docs/plugins/ (tool.execute.before), /rules/ e /skills/
#   cursor  https://cursor.com/docs/agent/hooks (hooks documentados para o app; no cursor-agent sem prova)
# MiniMax não tem agente próprio no Orca: conta pelo opencode (modelo minimax/...) ou pelo claude com ANTHROPIC_BASE_URL da API do MiniMax,
# com `medidor=orca:minimax` no agentes.conf (nao-testado).
